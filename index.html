<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shajarachi Admin</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app.js" defer></script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Shajarachi Admin</h1>
    <span id="who" class="muted"></span>
  </header>

  <section id="view-login" class="card" hidden>
    <form id="form-login">
      <label>Login (harf va raqam)
        <input id="login" type="text" pattern="[A-Za-z0-9]{3,32}" required autocomplete="username" autocapitalize="off">
      </label>
      <label>Parol
        <input id="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit">Kirish</button>
      <p id="msg-login" class="err" role="alert"></p>
    </form>
  </section>

  <section id="view-otp" class="card" hidden>
    <form id="form-otp">
      <p id="otp-hint" class="muted">Emailingizga yuborilgan 8 xonali kodni kiriting.</p>
      <label>Kod
        <input id="code" inputmode="numeric" pattern="\d{8}" maxlength="8" required autocomplete="one-time-code">
      </label>
      <button type="submit">Tasdiqlash</button>
      <p id="msg-otp" class="err" role="alert"></p>
    </form>
  </section>

  <section id="view-dashboard" hidden>
    <div class="stats">
      <div class="card"><div class="num" id="total">0</div><div class="muted">Jami murojaat</div></div>
      <div class="card"><div class="num" id="today">0</div><div class="muted">So‘nggi 24 soat</div></div>
    </div>
    <div id="messages"></div>
    <button id="logout" class="ghost" type="button">Chiqish</button>
  </section>
</main>
</body>
</html>
